[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogsnap"
version = "0.1.0"
description = "Batch pipeline that turns raw product photos into consistent, guardrail-checked catalog shots."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "pillow>=10.3",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "rembg[cpu]>=2.0.57",
    "langgraph>=0.2",
    "boto3>=1.34",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5", "fakeredis>=2.23"]

[project.scripts]
catalogsnap = "catalogsnap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
