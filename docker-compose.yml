# Local stack: API + 2 workers + Redis + MinIO.
#   docker compose up --build
#   API   http://localhost:8000/docs
#   MinIO http://localhost:9001  (minioadmin / minioadmin, local development only)
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  environment: &env
    CATALOGSNAP_QUEUE_BACKEND: redis
    CATALOGSNAP_REDIS_URL: redis://redis:6379/0
    CATALOGSNAP_STORAGE_BACKEND: s3
    CATALOGSNAP_S3_ENDPOINT_URL: http://minio:9000
    CATALOGSNAP_S3_ACCESS_KEY: minioadmin
    CATALOGSNAP_S3_SECRET_KEY: minioadmin
    CATALOGSNAP_SCENE_BACKEND: ${CATALOGSNAP_SCENE_BACKEND:-studio}
    CATALOGSNAP_BFL_API_KEY: ${CATALOGSNAP_BFL_API_KEY:-}
  depends_on: [redis, minio]

services:
  api:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: ["catalogsnap", "worker"]
    deploy:
      replicas: 2
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  minio-data:
